# Starter host-layer playbook. Keep this layer small and deliberate:
# things the MACHINE needs, not language runtimes or per-project deps.
# Run: ansible-playbook -K playbook.yml
- name: Dev machine host layer
  hosts: localhost
  connection: local
  become: true
  vars:
    dev_user: "{{ ansible_user_id }}"
  tasks:
    - name: Base host packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - git
          - tmux
          - curl
          - jq
          - build-essential
          - pkg-config
          - libssl-dev
          - etckeeper
          - direnv
        state: present

    - name: Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present

    - name: Docker engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ dev_user }}"
        groups: docker
        append: true
